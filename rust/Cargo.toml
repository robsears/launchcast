[workspace]
resolver = "2"
members = ["common", "ground-logic", "ground", "rocket-logic", "rocket", "log-decode"]

# `ground`/`rocket` are thumbv6m-none-eabi (Cortex-M0+) firmware crates and
# can't be built for the host, so they're excluded from the default host
# `cargo build`/`cargo test` run at the workspace root. Build them
# explicitly, e.g. `cargo build -p launchcast-rocket --target thumbv6m-none-eabi`.
# `log-decode` is the opposite of that split: a host-only CLI tool (see
# its own docs), so it belongs in the default set alongside the other
# host-buildable crates.
default-members = ["common", "ground-logic", "rocket-logic", "log-decode"]
